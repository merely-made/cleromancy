[package]
name = "cleromancy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Context-qualified deterministic and cleromantic readings over a local-first Mere graph."
repository = "https://github.com/merely-made/cleromancy"
keywords = ["divination", "randomness", "local-first", "graph"]
categories = ["gui"]
# The application cannot be published: its engine, graph, and shell
# dependencies are unpublished, so a release would resolve them from the
# registry and fail to build. The name is held by the 0.0.1 reservation in
# reservation/. Remove this once the platform crates publish for real.
publish = false

[features]
default = []
# Used by the nested acceptance package to compile the portable product core
# without Cleromancy's retired native Genet layout seam.
portable-core = []
# The data-free analytic engine. No kernel, no download, no filesystem.
analytic-ephemeris = ["dep:turquet"]
sky-timeline = ["dep:turquet-timeline"]
personal-sync = ["graphshell/personal-sync", "dep:personae", "dep:uuid"]
graphshell-admission = ["graphshell/native"]

# The platform family is pinned to Mere `addccab32fe45e54f99cae26ab03cf6aa9432f7e`
# and the exact Genet commit `2c7ef73bfa44c07744e0643e3c6f98be3cbd7947` that
# it consumes. Cargo keys a git source by URL plus reference, so a branch
# reference beside these commits would resolve a second source family and
# split shared types in consumers such as Isometry. Update these pins together
# when the platform integration moves.
[dependencies]
blake3 = "1"
cambium = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e", version = "0.3.3" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e", version = "0.1.0" }
chartulary = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e" }
dirs = "6"
graphshell = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e", default-features = false }
graphshell-client = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e", features = ["local", "stdio"] }
chirograph = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "2c7ef73bfa44c07744e0643e3c6f98be3cbd7947", version = "=0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "2c7ef73bfa44c07744e0643e3c6f98be3cbd7947", version = "=0.1.1" }
mesquite = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e" }
mere = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e", default-features = false, features = ["graph", "canvas"] }
meristem = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e", version = "=0.2.0" }
muniment = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e", features = ["redb"] }
personae = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391", optional = true }
pollster = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sceno = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e" }
scenotime = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servitor = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e" }
taproot = { git = "https://github.com/merely-made/genet.git", rev = "2c7ef73bfa44c07744e0643e3c6f98be3cbd7947" }
thiserror = "2"
tabard = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e" }
tabard-workshop = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e", features = ["native-host"] }
tinct = { git = "https://github.com/merely-made/mere.git", rev = "addccab32fe45e54f99cae26ab03cf6aa9432f7e" }
uuid = { version = "1", features = ["serde"], optional = true }
turquet = { version = "=0.1.0", optional = true }
turquet-timeline = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "30875f30e83909f3030bc01237a5046e14cde29b", version = "=0.17.0", optional = true }

[[bin]]
name = "a4_sync_receipt"
path = "src/bin/a4_sync_receipt.rs"
required-features = ["personal-sync"]

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"

# Current coherent renderer family, including owned Radeon and resource fixes.
# Root patches are not inherited from Mere or Genet. The native host resolves
# one maintained Classic 0.11 triple and the matching Netrender device source.
[patch.crates-io]
netrender_device = { git = "https://github.com/merely-made/netrender.git", rev = "c74b7cb28090c28b1c6d80b08dcdea18aff48d3e" }
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }

# Mere's p2panda family is the **owned fork**, not the published crates, as of
# the pinned Mere source: the net crate is `mere-p2panda-net =0.7.5`, a fork release
# that was never published, so a registry edge cannot resolve it at all. This
# app reaches the family transitively through `graphshell/personal-sync`, and
# `[patch]` does not cross workspaces, so this root restates mere's own table
# or the graph takes stock p2panda from crates.io and the sync path fails to
# compile against it. The fork's crates path-dep each other, so the family
# patches together or not at all — repointing one alone lands two
# `p2panda-core` copies and the trait bounds stop matching. The reference is
# mere's immutable release tag rather than a branch, so the two workspaces
# cannot drift a commit apart into the same duplicate hazard.
#
# `p2panda-auth`, `p2panda-stream`, `p2panda-blobs` and `p2panda-spaces` are
# deliberately absent even though mere patches some of them: nothing here
# reaches them under `--all-features`, so each would be a permanent "patch was
# not used" warning, and a wall of those is what hides the one that matters.
# The duplicate-copy hazard only applies to crates actually in the graph.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261011" }

# Genet's Livery/Buckram layout and text cone. Cambium's host reaches
# `genet-livery`, and `[patch]` is not inherited across workspaces, so this
# root must name Genet's own source for Taffy:
#
# `taffy` — genet renamed its vendored Taffy fork to `genet-taffy`, so the
# patch names the package explicitly while keeping the `taffy` dependency
# alias Cargo expects. Without it the identically named `genet-taffy 0.14.0`
# comes from crates.io instead of the revision this workspace pins.
#
# No `parley` or `fontique` row: as of genet `5ae30cad` those vendored forks
# are published as the packages `genet-parley` and `genet-fontique` (lib names
# still `parley` and `fontique`), so nothing in genet answers to the name
# `parley` and a row keyed on it would match no package and fail the resolve
# rather than sit inert. genet-livery reaches the fork by path inside the git
# checkout, so no row is needed to keep one copy in the graph, and nothing in
# this app names parley directly.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "2c7ef73bfa44c07744e0643e3c6f98be3cbd7947" }

# `ipc-channel` and `gpu-allocator` — genet vendors both to keep the `windows`
# crate on one version in any build that compiles the dx12 backend, and
# `[patch]` does not cross workspaces, so this root restates them or silently
# takes the registry copies. Measured here before the change: the graph
# carried `windows 0.61.3` and `0.62.2` at once. The 0.61.3 came in through
# registry `ipc-channel`, whose OS transport genet's fork makes optional; the
# fork drops that dependency. `gpu-allocator` already resolved `windows 0.62.2`
# on its own, so its entry buys source identity with the stack rather than a
# fix, and keeps the pair from drifting apart on a future resolve.
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "2c7ef73bfa44c07744e0643e3c6f98be3cbd7947" }
gpu-allocator = { git = "https://github.com/merely-made/genet.git", rev = "2c7ef73bfa44c07744e0643e3c6f98be3cbd7947" }
