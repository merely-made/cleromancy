[[bin]]
name = "a1_enrichment_receipt"
path = "src/bin/a1_enrichment_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a2_enriched_receipt"
path = "src/bin/a2_enriched_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
