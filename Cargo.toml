tempfile = "3"

# Current coherent renderer family, including owned Radeon and resource fixes.
# Root patches are not inherited from Mere or Genet. The native host resolves
# one maintained Classic 0.11 triple and the matching Netrender device source.
[patch.crates-io]
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
mere-proofs = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", rev = "c74b7cb28090c28b1c6d80b08dcdea18aff48d3e" }
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "2eae6243881d5b24c984d5ee35dde509ca5db782" }

# Mere's p2panda family is the **owned fork**, not the published crates, as of
# the pinned Mere source: the net crate is `mere-p2panda-net =0.7.5`, a fork release
# that was never published, so a registry edge cannot resolve it at all. This
# app reaches the family transitively through `graphshell/personal-sync`, and
# `[patch]` does not cross workspaces, so this root restates mere's own table
# or the graph takes stock p2panda from crates.io and the sync path fails to
# compile against it. The fork's crates path-dep each other, so the family
# patches together or not at all — repointing one alone lands two
# `p2panda-core` copies and the trait bounds stop matching. The reference is
# mere's immutable release tag rather than a branch, so the two workspaces
# cannot drift a commit apart into the same duplicate hazard.
#
# `p2panda-auth`, `p2panda-stream`, `p2panda-blobs` and `p2panda-spaces` are
# deliberately absent even though mere patches some of them: nothing here
# reaches them under `--all-features`, so each would be a permanent "patch was
# not used" warning, and a wall of those is what hides the one that matters.
# The duplicate-copy hazard only applies to crates actually in the graph.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }

# Genet's Livery/Buckram layout and text cone. Cambium's host reaches
# `genet-livery`, and `[patch]` is not inherited across workspaces, so this
# root must name Genet's own source for Taffy:
#
# `taffy` — genet renamed its vendored Taffy fork to `genet-taffy`, so the
# patch names the package explicitly while keeping the `taffy` dependency
# alias Cargo expects. Without it the identically named `genet-taffy 0.14.0`
# comes from crates.io instead of the revision this workspace pins.
#
# No `parley` or `fontique` row: as of genet `5ae30cad` those vendored forks
# are published as the packages `genet-parley` and `genet-fontique` (lib names
# still `parley` and `fontique`), so nothing in genet answers to the name
# `parley` and a row keyed on it would match no package and fail the resolve
# rather than sit inert. genet-livery reaches the fork by path inside the git
# checkout, so no row is needed to keep one copy in the graph, and nothing in
# this app names parley directly.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }

# `ipc-channel` and `gpu-allocator` — genet vendors both to keep the `windows`
# crate on one version in any build that compiles the dx12 backend, and
# `[patch]` does not cross workspaces, so this root restates them or silently
# takes the registry copies. Measured here before the change: the graph
# carried `windows 0.61.3` and `0.62.2` at once. The 0.61.3 came in through
# registry `ipc-channel`, whose OS transport genet's fork makes optional; the
# fork drops that dependency. `gpu-allocator` already resolved `windows 0.62.2`
# on its own, so its entry buys source identity with the stack rather than a
# fix, and keeps the pair from drifting apart on a future resolve.
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }
gpu-allocator = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }

# Dramatis retains this closed two-package Genet cone. Root patches do not
# cross workspaces; match Mere's immutable renderer revision through the alias.
[patch."https://github.com/merely-made/genet.git"]
fleece = { version = "=0.5.0", git = "https://www.github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }
layout-dom-api = { version = "=0.1.1", git = "https://www.github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }

