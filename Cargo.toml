stickleback = { git = "https://github.com/merely-made/eidetic.git", rev = "dceb5fcd07bfaeffc57142b06f07259eed0e89ef" }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
mere-transport = { git = "https://github.com/merely-made/murm.git", branch = "main" }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
mere-webrtc-carrier = { git = "https://github.com/merely-made/murm.git", branch = "main" }

# Mere's Djinn names this package through its own Cleromancy pin; the path keeps
# one Cleromancy source in this graph.
[patch."https://github.com/merely-made/cleromancy.git"]
cleromancy-core-acceptance = { path = "core" }

[patch."https://github.com/merely-made/retinue.git"]
mere-transport = { git = "https://github.com/merely-made/murm.git", branch = "main" }
mere-webrtc-carrier = { git = "https://github.com/merely-made/murm.git", branch = "main" }
retinue = { git = "https://github.com/merely-made/murm.git", branch = "main" }




# The shared CPU decoder needs optimized tensor kernels even in desktop debug
# builds; this does not change the selected backend or sampling contract.
[profile.dev.package.esp]
opt-level = 3
[profile.dev.package.burn-ndarray]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.burn-tensor]
opt-level = 3
[profile.dev.package.burn-dispatch]
opt-level = 3

# Replay verifies saved typed decks and inference sources in desktop debug builds.
# Optimize those existing CPU paths without changing validation or stored bytes.
[profile.dev.package.cleromancy]
opt-level = 1
[profile.dev.package.cleromancy-core-acceptance]
opt-level = 1
[profile.dev.package.serde_json]
opt-level = 2

