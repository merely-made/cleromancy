[package]
rust-version = "1.97.1"
name = "cleromancy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Context-qualified deterministic and cleromantic readings over a local-first Mere graph."
repository = "https://github.com/merely-made/cleromancy"
keywords = ["divination", "randomness", "local-first", "graph"]
categories = ["gui"]
# The application cannot be published: its engine, graph, and shell
# dependencies are unpublished, so a release would resolve them from the
# registry and fail to build. The name is held by the 0.0.1 reservation in
# reservation/. Remove this once the platform crates publish for real.
publish = false

[features]
default = []
# Used by the nested acceptance package to compile the portable product core
# without Cleromancy's retired native Genet layout seam.
portable-core = []
# Historical private-store receipt fixtures; never enabled by the ordinary app.
legacy-receipts = []
# The data-free analytic engine. No kernel, no download, no filesystem.
analytic-ephemeris = ["dep:turquet"]
sky-timeline = ["dep:turquet-timeline"]
personal-sync = ["graphshell/personal-sync", "dep:uuid"]
graphshell-admission = ["graphshell/native"]

# The frozen C1 family is pinned to Mere `c51e1913cc52cc161815b97939a46452495747e0`
# and the exact Genet commit `b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084` that
# it consumes. Cargo keys a git source by URL plus reference, so a branch
# reference beside these commits would resolve a second source family and
# split shared types in consumers such as Isometry. Update these pins together
# when the platform integration moves.
[dependencies]
djinn = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0", default-features = false }
mere-view = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
pandect = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
sprigging = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
blake3 = "1"
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0", version = "0.3.3" }
cambium-genet-winit-host = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0", version = "0.1.0" }
chartulary = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
dirs = "6"
graphshell = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0", default-features = false, features = ["native", "mere-route"] }
graphshell-client = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
graphshell-endpoint = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0", features = ["local", "stdio"] }
chirograph = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084", version = "=0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084", version = "=0.1.1" }
mesquite = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
mere = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0", default-features = false, features = ["graph", "canvas"] }
meristem = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0", version = "=0.2.0" }
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0", features = ["redb"] }
personae = { git = "https://github.com/merely-made/dramatis.git", rev = "0234e7eea6f2ddf2330a71b9425da01b06ae0391" }
pollster = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
scenotime = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servitor = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
taproot = { git = "https://github.com/merely-made/genet.git", rev = "b6bfbeb556a6a17eddf8d5ad8254d3fcac95b084" }
thiserror = "2"
tabard = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
tabard-workshop = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0", features = ["native-host"] }
tinct = { git = "https://www.github.com/merely-made/mere.git", rev = "c51e1913cc52cc161815b97939a46452495747e0" }
uuid = { version = "1", features = ["serde"], optional = true }
turquet = { version = "=0.1.0", optional = true }
turquet-timeline = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "30875f30e83909f3030bc01237a5046e14cde29b", version = "=0.17.0", optional = true }

