[package]
name = "cleromancy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Context-qualified deterministic and cleromantic readings over a local-first Mere graph."
repository = "https://github.com/merely-made/cleromancy"
keywords = ["divination", "randomness", "local-first", "graph"]
categories = ["gui"]

[features]
default = []
ephemeris = ["dep:anise", "dep:sha2", "dep:sofars", "dep:ureq"]
# The data-free analytic engine. No kernel, no download, no filesystem.
analytic-ephemeris = ["dep:vsop87", "dep:sofars"]
personal-sync = ["graphshell/personal-sync", "dep:personae", "dep:uuid"]
graphshell-admission = ["graphshell/native"]

[dependencies]
accesskit = "0.24"
anise = { git = "https://github.com/merely-made/anise.git", rev = "71e973a245e6701e14a5d4c88a3c4e7dedbf7702", version = "=0.10.6", default-features = false, optional = true }
blake3 = "1"
cambium = { git = "https://github.com/merely-made/genet.git", branch = "main" }
cambium-winit = { git = "https://github.com/merely-made/genet.git", branch = "main" }
chartulary = { git = "https://github.com/merely-made/mere.git", branch = "main" }
dirs = "6"
graphshell = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
graphshell-client = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-local = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-protocol = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-stdio = { git = "https://github.com/merely-made/mere.git", branch = "main" }
genet-layout = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-probe = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.0" }
genet-winit-host = { git = "https://github.com/merely-made/genet.git", branch = "main" }
image = { version = "0.25", default-features = false, features = ["png"] }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.0" }
mere = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["graph", "canvas"] }
muniment = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["redb"] }
netrender = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_render = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
personae = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
pollster = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sceno = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenotime = { git = "https://github.com/merely-made/mere.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
sofars = { version = "=0.6.1", optional = true }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"], optional = true }
servitor = { git = "https://github.com/merely-made/mere.git", branch = "main" }
thiserror = "2"
uuid = { version = "1", features = ["serde"], optional = true }
vsop87 = { version = "3", default-features = false, optional = true }
wgpu = { version = "29", default-features = false, features = ["std"] }
winit = "0.30"

[[bin]]
name = "a4_sync_receipt"
path = "src/bin/a4_sync_receipt.rs"
required-features = ["personal-sync"]

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
