[package]
name = "cleromancy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Context-qualified deterministic and cleromantic readings over a local-first Mere graph."
repository = "https://github.com/merely-made/cleromancy"
keywords = ["divination", "randomness", "local-first", "graph"]
categories = ["gui"]
# The application cannot be published: its engine, graph, and shell
# dependencies are unpublished, so a release would resolve them from the
# registry and fail to build. The name is held by the 0.0.1 reservation in
# reservation/. Remove this once the platform crates publish for real.
publish = false

[features]
default = []
# Used by the nested acceptance package to compile the portable product core
# without Cleromancy's retired native Genet layout seam.
portable-core = []
# The data-free analytic engine. No kernel, no download, no filesystem.
analytic-ephemeris = ["dep:turquet"]
sky-timeline = ["dep:turquet-timeline"]
personal-sync = ["graphshell/personal-sync", "dep:personae", "dep:uuid"]
graphshell-admission = ["graphshell/native"]

# The platform family is pinned to Mere `fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c`
# and the exact Genet commit `3a7b50230d447f6fa7ed6921cba019f78347d932` that
# it consumes. Cargo keys a git source by URL plus reference, so a branch
# reference beside these commits would resolve a second source family and
# split shared types in consumers such as Isometry. Update these pins together
# when the platform integration moves.
[dependencies]
blake3 = "1"
cambium = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c", version = "0.3.3" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c", version = "0.1.0" }
chartulary = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c" }
dirs = "6"
graphshell = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c", default-features = false }
graphshell-client = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c" }
graphshell-local = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c" }
chirograph = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c" }
graphshell-stdio = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c" }
genet-probe = { git = "https://github.com/merely-made/genet.git", rev = "3a7b50230d447f6fa7ed6921cba019f78347d932" }
image = { version = "0.25", default-features = false, features = ["png"] }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "3a7b50230d447f6fa7ed6921cba019f78347d932", version = "=0.1.0" }
mere = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c", default-features = false, features = ["graph", "canvas"] }
muniment = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c", features = ["redb"] }
personae = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c", optional = true }
pollster = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sceno = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c" }
scenotime = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servitor = { git = "https://github.com/merely-made/mere.git", rev = "fb7e136b13298b1e9c56ece8a282fb1b1fac4d8c" }
thiserror = "2"
uuid = { version = "1", features = ["serde"], optional = true }
turquet = { version = "=0.1.0", optional = true }
turquet-timeline = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "30875f30e83909f3030bc01237a5046e14cde29b", version = "=0.17.0", optional = true }

[[bin]]
name = "a4_sync_receipt"
path = "src/bin/a4_sync_receipt.rs"
required-features = ["personal-sync"]

[dev-dependencies]
async-trait = "0.1"
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "3a7b50230d447f6fa7ed6921cba019f78347d932", version = "=0.1.0" }
tempfile = "3"

# Vello on wgpu 30. Upstream vello 0.10 still requires wgpu 29, so netrender
# (and through it this app's render path) takes vello from the owned fork:
# the v0.10.0 tag plus exactly the API changes in linebender/vello#1754.
# `[patch]` applies only from the top-level manifest and is NOT inherited
# from genet or netrender, so every app workspace restates it. Retires by
# deletion when upstream ships a wgpu-30 vello.
[patch.crates-io]
vello = { git = "https://github.com/mark-ik/vello.git", branch = "mark-ik/wgpu-30" }

# Genet's Livery/Buckram layout and text cone. Cambium's host reaches
# `genet-livery`, and `[patch]` is not inherited across workspaces, so this
# root must name Genet's own sources for both:
#
# `taffy` — genet renamed its vendored Taffy fork to `genet-taffy`, so the
# patch names the package explicitly while keeping the `taffy` dependency
# alias Cargo expects. Without it the identically named `genet-taffy 0.14.0`
# comes from crates.io instead of the revision this workspace pins.
#
# `parley` — genet-livery uses `AlignmentOptions::last_line_alignment` and
# `StyleProperty::TabSize`, which published parley 0.10.0 does not have at the
# same version number, so the fork's own source fails to compile against the
# registry crate.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "3a7b50230d447f6fa7ed6921cba019f78347d932" }
parley = { git = "https://github.com/merely-made/genet.git", rev = "3a7b50230d447f6fa7ed6921cba019f78347d932" }

# `ipc-channel` and `gpu-allocator` — genet vendors both to keep the `windows`
# crate on one version in any build that compiles the dx12 backend, and
# `[patch]` does not cross workspaces, so this root restates them or silently
# takes the registry copies. Measured here before the change: the graph
# carried `windows 0.61.3` and `0.62.2` at once. The 0.61.3 came in through
# registry `ipc-channel`, whose OS transport genet's fork makes optional; the
# fork drops that dependency. `gpu-allocator` already resolved `windows 0.62.2`
# on its own, so its entry buys source identity with the stack rather than a
# fix, and keeps the pair from drifting apart on a future resolve.
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "3a7b50230d447f6fa7ed6921cba019f78347d932" }
gpu-allocator = { git = "https://github.com/merely-made/genet.git", rev = "3a7b50230d447f6fa7ed6921cba019f78347d932" }
