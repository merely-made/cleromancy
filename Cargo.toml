[package]
name = "cleromancy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Context-qualified deterministic and cleromantic readings over a local-first Mere graph."
repository = "https://github.com/merely-made/cleromancy"
keywords = ["divination", "randomness", "local-first", "graph"]
categories = ["gui"]
# The application cannot be published: its engine, graph, and shell
# dependencies are unpublished, so a release would resolve them from the
# registry and fail to build. The name is held by the 0.0.1 reservation in
# reservation/. Remove this once the platform crates publish for real.
publish = false

[features]
default = []
# Used by the nested acceptance package to compile the portable product core
# without Cleromancy's retired native Genet layout seam.
portable-core = []
# The data-free analytic engine. No kernel, no download, no filesystem.
analytic-ephemeris = ["dep:turquet"]
sky-timeline = ["dep:turquet-timeline"]
personal-sync = ["graphshell/personal-sync", "dep:personae", "dep:uuid"]
graphshell-admission = ["graphshell/native"]

# The platform family is pinned to Mere `e95326dc08446a9256d3e340c63e571684afe697`
# and the exact Genet commit `7422e90613f9017e5bb790e3acb48f61776b2eda` that
# it consumes. Cargo keys a git source by URL plus reference, so a branch
# reference beside these commits would resolve a second source family and
# split shared types in consumers such as Isometry. Update these pins together
# when the platform integration moves.
[dependencies]
blake3 = "1"
cambium = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697", version = "0.3.3" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697", version = "0.1.0" }
chartulary = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697" }
dirs = "6"
graphshell = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697", default-features = false }
graphshell-client = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697", features = ["local", "stdio"] }
chirograph = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda", version = "=0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda", version = "=0.1.1" }
mesquite = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697" }
mere = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697", default-features = false, features = ["graph", "canvas"] }
meristem = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697", version = "=0.2.0" }
muniment = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697", features = ["redb"] }
personae = { git = "https://github.com/merely-made/dramatis.git", rev = "c1d620764315b4c750fcffea30b8c898b8bb73bc", optional = true }
pollster = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sceno = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697" }
scenotime = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servitor = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697" }
taproot = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda" }
thiserror = "2"
tabard = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697" }
tabard-workshop = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697", features = ["native-host"] }
tinct = { git = "https://github.com/merely-made/mere.git", rev = "e95326dc08446a9256d3e340c63e571684afe697" }
uuid = { version = "1", features = ["serde"], optional = true }
turquet = { version = "=0.1.0", optional = true }
turquet-timeline = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "30875f30e83909f3030bc01237a5046e14cde29b", version = "=0.17.0", optional = true }

[[bin]]
name = "a4_sync_receipt"
path = "src/bin/a4_sync_receipt.rs"
required-features = ["personal-sync"]

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"

# Vello on wgpu 30. Upstream vello 0.10 still requires wgpu 29, so netrender
# (and through it this app's render path) takes vello from the owned fork:
# the v0.10.0 tag plus exactly the API changes in linebender/vello#1754.
# `[patch]` applies only from the top-level manifest and is NOT inherited
# from genet or netrender, so every app workspace restates it. Retires by
# deletion when upstream ships a wgpu-30 vello.
[patch.crates-io]
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
# Root-owned maintained renderer patches are not inherited from dependencies.
netrender-vello = { git = "https://github.com/mark-ik/vello.git", rev = "10f01d6d88e94eac087daf033b24895cf97b8e82" }
vello_encoding = { git = "https://github.com/mark-ik/vello.git", rev = "10f01d6d88e94eac087daf033b24895cf97b8e82" }
vello_shaders = { git = "https://github.com/mark-ik/vello.git", rev = "10f01d6d88e94eac087daf033b24895cf97b8e82" }

# Mere's p2panda family is the **owned fork**, not the published crates, as of
# the pinned Mere source: the net crate is `mere-p2panda-net =0.7.5`, a fork release
# that was never published, so a registry edge cannot resolve it at all. This
# app reaches the family transitively through `graphshell/personal-sync`, and
# `[patch]` does not cross workspaces, so this root restates mere's own table
# or the graph takes stock p2panda from crates.io and the sync path fails to
# compile against it. The fork's crates path-dep each other, so the family
# patches together or not at all — repointing one alone lands two
# `p2panda-core` copies and the trait bounds stop matching. The reference is
# mere's immutable release tag rather than a branch, so the two workspaces
# cannot drift a commit apart into the same duplicate hazard.
#
# `p2panda-auth`, `p2panda-stream`, `p2panda-blobs` and `p2panda-spaces` are
# deliberately absent even though mere patches some of them: nothing here
# reaches them under `--all-features`, so each would be a permanent "patch was
# not used" warning, and a wall of those is what hides the one that matters.
# The duplicate-copy hazard only applies to crates actually in the graph.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }

# Genet's Livery/Buckram layout and text cone. Cambium's host reaches
# `genet-livery`, and `[patch]` is not inherited across workspaces, so this
# root must name Genet's own source for Taffy:
#
# `taffy` — genet renamed its vendored Taffy fork to `genet-taffy`, so the
# patch names the package explicitly while keeping the `taffy` dependency
# alias Cargo expects. Without it the identically named `genet-taffy 0.14.0`
# comes from crates.io instead of the revision this workspace pins.
#
# No `parley` or `fontique` row: as of genet `5ae30cad` those vendored forks
# are published as the packages `genet-parley` and `genet-fontique` (lib names
# still `parley` and `fontique`), so nothing in genet answers to the name
# `parley` and a row keyed on it would match no package and fail the resolve
# rather than sit inert. genet-livery reaches the fork by path inside the git
# checkout, so no row is needed to keep one copy in the graph, and nothing in
# this app names parley directly.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda" }

# `ipc-channel` and `gpu-allocator` — genet vendors both to keep the `windows`
# crate on one version in any build that compiles the dx12 backend, and
# `[patch]` does not cross workspaces, so this root restates them or silently
# takes the registry copies. Measured here before the change: the graph
# carried `windows 0.61.3` and `0.62.2` at once. The 0.61.3 came in through
# registry `ipc-channel`, whose OS transport genet's fork makes optional; the
# fork drops that dependency. `gpu-allocator` already resolved `windows 0.62.2`
# on its own, so its entry buys source identity with the stack rather than a
# fix, and keeps the pair from drifting apart on a future resolve.
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda" }
gpu-allocator = { git = "https://github.com/merely-made/genet.git", rev = "7422e90613f9017e5bb790e3acb48f61776b2eda" }
