[package]
rust-version = "1.97.1"
name = "cleromancy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Context-qualified deterministic and cleromantic readings over a local-first Mere graph."
repository = "https://github.com/merely-made/cleromancy"
keywords = ["divination", "randomness", "local-first", "graph"]
categories = ["gui"]
# The application cannot be published: its engine, graph, and shell
# dependencies are unpublished, so a release would resolve them from the
# registry and fail to build. The name is held by the 0.0.1 reservation in
# reservation/. Remove this once the platform crates publish for real.
publish = false

[features]
default = ["local-inference"]
# Used by the nested acceptance package to compile the portable product core
# without Cleromancy's retired native Genet layout seam.
portable-core = []
local-inference = ["dep:esp", "esp/decoder", "dep:sha2"]
# Historical private-store receipt fixtures; never enabled by the ordinary app.
legacy-receipts = []
# The data-free analytic engine. No kernel, no download, no filesystem.
analytic-ephemeris = ["dep:turquet"]
sky-timeline = []
personal-sync = ["graphshell/personal-sync", "dep:uuid"]
graphshell-admission = ["graphshell-host/native"]

# Family repositories share a canonical Git URL and branch = "main".
# Cargo.lock records the exact tested revisions; intake updates the lock.
# The original C1/C2 qualification retains its frozen supplier identities.
[dependencies]
dramatis = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
personal-facts = { package = "mere-facts", git = "https://github.com/merely-made/mere.git", branch = "main" }

esp = { optional = true, default-features = false, git = "https://github.com/merely-made/esp.git", rev = "bd0468c5c44c0b098494d30b3cfd0aa283cecf48" }
sha2 = { version = "0.10", optional = true }
fetch = { package = "mere-fetch", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
mere-resident = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
djinn = { version = "0.0.3", git = "https://github.com/merely-made/armillary.git", rev = "73968e28e2ceb78399b9d533bfa037cd300126c5", features = ["door-native"] }
mere-overmap = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["resident"] }
mere-view = { git = "https://github.com/merely-made/mere.git", branch = "main" }
pandect = { git = "https://github.com/merely-made/mere.git", branch = "main" }
sprigging = { git = "https://github.com/merely-made/mere.git", branch = "main" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
blake3 = "1"
cambium = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.6.0" }
cambium-desktop = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "0.1.0" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
dirs = "6"
graphshell = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = [] }
graphshell-host = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["native"] }
graphshell-client = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["local", "stdio", "projection-door"] }
chirograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "=0.1.1" }
mesquite = { git = "https://github.com/merely-made/mere.git", branch = "main" }
mere = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["graph", "canvas"] }
meristem = { git = "https://github.com/merely-made/mere.git", branch = "main", version = "=0.2.0" }
muniment = { features = ["redb"], git = "https://github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
pollster = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
sceno = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/mere.git", branch = "main" }
seiche = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["serde"] }
alembic = { package = "mere-alembic", git = "https://github.com/merely-made/mere.git", branch = "main", features = ["recall"] }
scenotime = { git = "https://github.com/merely-made/mere.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servitor = { git = "https://github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
taproot = { git = "https://github.com/merely-made/genet.git", branch = "main" }
thiserror = "2"
tabard = { git = "https://github.com/merely-made/mere.git", branch = "main" }
tabard-workshop = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["native-host"] }
tinct = { git = "https://github.com/merely-made/mere.git", branch = "main" }
uuid = { version = "1", features = ["serde"], optional = true }
turquet = { version = "=0.1.0", optional = true }
# One Turquet 0.17 source serves the timeline (30875f30), houses (e2f65c02) and
# cap (8e3755bb) editions; 8e3755bb reproduces the first two bit for bit.
turquet-017 = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "8e3755bbd0d40343eb4750b072801c941ff32802", version = "=0.17.0" }

[[bin]]
name = "a4_sync_receipt"
path = "src/bin/a4_sync_receipt.rs"
required-features = ["legacy-receipts", "personal-sync"]

[[bin]]
name = "a15_pattern_receipt"
path = "src/bin/a15_pattern_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a16_pattern_selection_receipt"
path = "src/bin/a16_pattern_selection_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a1_enrichment_receipt"
path = "src/bin/a1_enrichment_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a2_enriched_receipt"
path = "src/bin/a2_enriched_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a3_intent_receipt"
path = "src/bin/a3_intent_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a5_field_receipt"
path = "src/bin/a5_field_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a6_tarot_receipt"
path = "src/bin/a6_tarot_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a7_session_receipt"
path = "src/bin/a7_session_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a8_three_card_receipt"
path = "src/bin/a8_three_card_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "cleromancy_receipt"
path = "src/bin/cleromancy_receipt.rs"
required-features = ["legacy-receipts"]

[dev-dependencies]
# The resident task set the app door used to export (Mere 8f26d9629 moved it here).
armillary = { git = "https://github.com/merely-made/armillary.git", rev = "864f107d44bf759111ad2ea3c9036b2cfbf03f4c" }
async-trait = "0.1"
castellan = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["keeper"] }
mere-resident = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["in-process-custody"] }
tempfile = "3"

# Current coherent renderer family, including owned Radeon and resource fixes.
# Root patches are not inherited from Mere or Genet. The native host resolves
# one maintained Classic 0.11 triple and the matching Netrender device source.
[patch.crates-io]
# Promoted sources shared with immutable older Mere suppliers.
errand = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
finger-protocol = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
gemini-protocol = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
gopher-protocol = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
guppy-protocol = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
misfin = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
nex-protocol = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
scroll-protocol = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
spartan-protocol = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
# Canonical promoted families; keep registry and Git consumers type-identical.
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
esp = { git = "https://www.github.com/merely-made/esp.git", rev = "bd0468c5c44c0b098494d30b3cfd0aa283cecf48" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
# Mere's patched AccessKit (support/patches/accesskit): its cambium hosts call
# methods only the patched copy has, so take that copy from Mere.
accesskit = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# wgpu-cue's registry crates name the session API; keep it Genet's, as Mere does.
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }

# Mere's p2panda family is the **owned fork**, not the published crates, as of
# the pinned Mere source: the net crate is `mere-p2panda-net =0.7.5`, a fork release
# that was never published, so a registry edge cannot resolve it at all. This
# app reaches the family transitively through `graphshell/personal-sync`, and
# `[patch]` does not cross workspaces, so this root restates mere's own table
# or the graph takes stock p2panda from crates.io and the sync path fails to
# compile against it. The fork's crates path-dep each other, so the family
# patches together or not at all — repointing one alone lands two
# `p2panda-core` copies and the trait bounds stop matching. The reference is
# mere's immutable release tag rather than a branch, so the two workspaces
# cannot drift a commit apart into the same duplicate hazard.
#
# `p2panda-auth`, `p2panda-stream`, `p2panda-blobs` and `p2panda-spaces` are
# deliberately absent even though mere patches some of them: nothing here
# reaches them under `--all-features`, so each would be a permanent "patch was
# not used" warning, and a wall of those is what hides the one that matters.
# The duplicate-copy hazard only applies to crates actually in the graph.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }

# Livery and Buckram select the published genet-taffy package directly.

# `ipc-channel` and `gpu-allocator` — genet vendors both to keep the `windows`
# crate on one version in any build that compiles the dx12 backend, and
# `[patch]` does not cross workspaces, so this root restates them or silently
# takes the registry copies. Measured here before the change: the graph
# carried `windows 0.61.3` and `0.62.2` at once. The 0.61.3 came in through
# registry `ipc-channel`, whose OS transport genet's fork makes optional; the
# fork drops that dependency. `gpu-allocator` already resolved `windows 0.62.2`
# on its own, so its entry buys source identity with the stack rather than a
# fix, and keeps the pair from drifting apart on a future resolve.
gpu-allocator = { git = "https://github.com/merely-made/genet.git", branch = "main" }


# Family source convention (Mere family composition brief): every first-party row
# names its repository by `branch = "main"` at the canonical URL and Cargo.lock
# pins the revision, so the www and double-slash spellings that gave two sources
# one replacement identity are gone. These rows redirect packages that left Mere.
[patch."https://github.com/merely-made/mere.git"]
# Promoted sources shared with immutable older Mere suppliers.
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
errand = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
esp = { git = "https://www.github.com/merely-made/esp.git", rev = "bd0468c5c44c0b098494d30b3cfd0aa283cecf48" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
insigne = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
mere-transport = { git = "https://github.com/merely-made/murm.git", branch = "main" }
notochord = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
murm-webrtc = { git = "https://github.com/merely-made/murm.git", branch = "main" }

# Mere's Djinn names this package through its own Cleromancy pin; the path keeps
# one Cleromancy source in this graph.
[patch."https://github.com/merely-made/cleromancy.git"]
cleromancy-core = { path = "core" }

# Older suppliers (Mere's Knot pin among them) name earlier eidetic and esp
# revisions. Mere routes every revision through the www spelling of the URL at
# its own pin; restating that here keeps one copy of each in this graph.
[patch."https://github.com/merely-made/eidetic.git"]
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "01ee97b0b95d679430986dffd54c64ce9b3b5ea3" }

[patch."https://github.com/merely-made/esp.git"]
esp = { git = "https://www.github.com/merely-made/esp.git", rev = "bd0468c5c44c0b098494d30b3cfd0aa283cecf48" }

[patch."https://github.com/merely-made/retinue.git"]
mere-transport = { git = "https://github.com/merely-made/murm.git", branch = "main" }
murm-webrtc = { git = "https://github.com/merely-made/murm.git", branch = "main" }




# The shared CPU decoder needs optimized tensor kernels even in desktop debug
# builds; this does not change the selected backend or sampling contract.
[profile.dev.package.esp]
opt-level = 3
[profile.dev.package.burn-ndarray]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.burn-tensor]
opt-level = 3
[profile.dev.package.burn-dispatch]
opt-level = 3

# Replay verifies saved typed decks and inference sources in desktop debug builds.
# Optimize those existing CPU paths without changing validation or stored bytes.
[profile.dev.package.cleromancy]
opt-level = 1
[profile.dev.package.cleromancy-core]
opt-level = 1
[profile.dev.package.serde_json]
opt-level = 2

[patch."https://www.github.com/merely-made/mere.git"]
