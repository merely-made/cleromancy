[package]
rust-version = "1.97.1"
name = "cleromancy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Context-qualified deterministic and cleromantic readings over a local-first Mere graph."
repository = "https://github.com/merely-made/cleromancy"
keywords = ["divination", "randomness", "local-first", "graph"]
categories = ["gui"]
# The application cannot be published: its engine, graph, and shell
# dependencies are unpublished, so a release would resolve them from the
# registry and fail to build. The name is held by the 0.0.1 reservation in
# reservation/. Remove this once the platform crates publish for real.
publish = false

[features]
default = ["local-inference"]
# Used by the nested acceptance package to compile the portable product core
# without Cleromancy's retired native Genet layout seam.
portable-core = []
local-inference = ["dep:esp", "esp/decoder-flex", "dep:sha2"]
# Historical private-store receipt fixtures; never enabled by the ordinary app.
legacy-receipts = []
# The data-free analytic engine. No kernel, no download, no filesystem.
analytic-ephemeris = ["dep:turquet"]
sky-timeline = ["dep:cleromancy-sky"]
personal-sync = ["pandect/personal-sync", "dep:uuid"]
graphshell-admission = ["graphshell-host/native"]

# Family repositories share a canonical Git URL and branch = "main".
# Cargo.lock records the exact tested revisions; intake updates the lock.
# The original C1/C2 qualification retains its frozen supplier identities.
[dependencies]
dramatis-resident = { git = "https://github.com/merely-made/dramatis.git", branch = "main", default-features = false }
dramatis = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
personal-facts = { package = "mere-facts", git = "https://github.com/merely-made/mere.git", branch = "main" }

esp = { optional = true, default-features = false, git = "https://github.com/merely-made/distillery.git", branch = "main" }
sha2 = { version = "0.11", optional = true }
fetch = { package = "mere-fetch", git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false }
mere-resident = { git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false }
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main", features = ["native"] }
mere-overmap = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["resident"] }
mere-view = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
pandect = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# The reading view's state type (engine split D78: ViewIntent left pandect).
incipit = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["view"] }
sprigging = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
blake3 = "1"
cambium = { git = "https://github.com/merely-made/graphshell.git", branch = "main", version = "0.6.0" }
cambium-desktop = { git = "https://github.com/merely-made/graphshell.git", branch = "main", version = "0.1.0" }
portolan = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
dirs = "7"
graphshell-host = { git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false, features = ["native"] }
graphshell-client = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["local", "stdio"] }
graphshell-door = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["projection-door"] }
chirograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "0.1.2" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "0.1.1" }
kernel = { package = "mere-kernel", git = "https://github.com/merely-made/mere.git", branch = "main" }
mandrake = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
meristem = { git = "https://github.com/merely-made/graphshell.git", branch = "main", version = "0.2.0" }
muniment = { features = ["redb"], git = "https://github.com/merely-made/eidetic.git", branch = "main" }
cartography = { package = "mere-cartography", git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false, features = ["canvas", "physics-engine"] }
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
pollster = "1"
getrandom = "0.4"
sceno = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
seiche = { git = "https://github.com/merely-made/seiche.git", branch = "main", default-features = false, features = ["serde"] }
scenotime = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servitor = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
taproot = { git = "https://github.com/merely-made/genet.git", branch = "main" }
thiserror = "2"
tabard = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
tabard-workshop = { git = "https://github.com/merely-made/graphshell.git", branch = "main", features = ["native-host"] }
tinct = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
uuid = { version = "1", features = ["serde"], optional = true }
turquet = { version = "=0.1.0", optional = true }
# One Turquet 0.17 source serves the timeline (30875f30), houses (e2f65c02) and
# cap (8e3755bb) editions; 8e3755bb reproduces the first two bit for bit.
turquet-017 = { package = "turquet", path = "crates/turquet", version = "=0.17.0" }
cleromancy-sky = { path = "crates/cleromancy-sky", optional = true }

[[bin]]
name = "a4_sync_receipt"
path = "src/bin/a4_sync_receipt.rs"
required-features = ["legacy-receipts", "personal-sync"]

[[bin]]
name = "a15_pattern_receipt"
path = "src/bin/a15_pattern_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a16_pattern_selection_receipt"
path = "src/bin/a16_pattern_selection_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a1_enrichment_receipt"
path = "src/bin/a1_enrichment_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a2_enriched_receipt"
path = "src/bin/a2_enriched_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a3_intent_receipt"
path = "src/bin/a3_intent_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a5_field_receipt"
path = "src/bin/a5_field_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a6_tarot_receipt"
path = "src/bin/a6_tarot_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a7_session_receipt"
path = "src/bin/a7_session_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "a8_three_card_receipt"
path = "src/bin/a8_three_card_receipt.rs"
required-features = ["legacy-receipts"]

[[bin]]
name = "cleromancy_receipt"
path = "src/bin/cleromancy_receipt.rs"
required-features = ["legacy-receipts"]

[dev-dependencies]
# Raw facet-store access for the sync tamper tests (tests only, not the library).
kernel = { package = "mere-kernel", git = "https://github.com/merely-made/mere.git", branch = "main", features = ["fixtures"] }
# The resident task set the app door used to export (Mere 8f26d9629 moved it here).
armillary = { git = "https://github.com/merely-made/armillary.git", branch = "main" }
async-trait = "0.1"
castellan = { git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["keeper"] }
mere-resident = { git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false, features = ["in-process-custody"] }
tempfile = "3"
# The authority guest tests sign the component into the pack the owner reviews.
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main", features = ["pack-signing"] }
uuid = { version = "1", features = ["v4"] }
# The grant logic the granted-ambient test stands a door up with.
djinn = { version = "0.0.3", git = "https://github.com/merely-made/armillary.git", branch = "main", features = ["door", "door-native"] }

# Current coherent renderer family, including owned Radeon and resource fixes.
# Root patches are not inherited from Mere or Genet. The native host resolves
# one maintained Classic 0.11 triple and the matching Netrender device source.
[patch.crates-io]
# Producer contracts use the same Mere source as the host.
sceno = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenotime = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenomise = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
incipit = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
chirograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
mere-surface-api = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
cambium = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
workbench = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
hest = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
sprigging = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# Resident custody and the host share one OS peer-facts vocabulary.
peer-facts = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }
# Promoted sources shared with immutable older Mere suppliers.
gemini-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
scroll-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
spartan-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
# Canonical promoted families; keep registry and Git consumers type-identical.
fieldbook = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
hodograph = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
portolan = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
quadstore = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
esp = { git = "https://github.com/merely-made/distillery.git", branch = "main" }
luggage = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
servitor = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# wgpu-cue's registry crates name the session API; keep it Genet's, as Mere does.
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
netrender-vello = { git = "https://github.com/mark-ik/vello", branch = "mark-ik/all-vellos" }
netrender-vello-encoding = { git = "https://github.com/mark-ik/vello", branch = "mark-ik/all-vellos" }
netrender-vello-shaders = { git = "https://github.com/mark-ik/vello", branch = "mark-ik/all-vellos" }

# Livery and Buckram select the published genet-taffy package directly.

# `ipc-channel` and `gpu-allocator` — genet vendors both to keep the `windows`
# crate on one version in any build that compiles the dx12 backend, and
# `[patch]` does not cross workspaces, so this root restates them or silently
# takes the registry copies. Measured here before the change: the graph
# carried `windows 0.61.3` and `0.62.2` at once. The 0.61.3 came in through
# registry `ipc-channel`, whose OS transport genet's fork makes optional; the
# fork drops that dependency. `gpu-allocator` already resolved `windows 0.62.2`
# on its own, so its entry buys source identity with the stack rather than a
# fix, and keeps the pair from drifting apart on a future resolve.
gpu-allocator = { git = "https://github.com/merely-made/genet.git", branch = "main" }

# Older suppliers (Mere's Knot pin among them) name earlier eidetic and esp
# revisions. Mere routes every revision through the www spelling of the URL at
# its own pin; restating that here keeps one copy of each in this graph.
[patch."https://github.com/merely-made/retinue.git"]
mere-transport = { git = "https://github.com/merely-made/murm.git", branch = "main" }
murm-webrtc = { git = "https://github.com/merely-made/murm.git", branch = "main" }

# The shared CPU decoder needs optimized tensor kernels even in desktop debug
# builds; this does not change the selected backend or sampling contract.
[profile.dev.package.esp]
opt-level = 3
[profile.dev.package.burn-flex]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.burn-tensor]
opt-level = 3
[profile.dev.package.burn-dispatch]
opt-level = 3

# Replay verifies saved typed decks and inference sources in desktop debug builds.
# Optimize those existing CPU paths without changing validation or stored bytes.
[profile.dev.package.cleromancy]
opt-level = 1
[profile.dev.package.cleromancy-core]
opt-level = 1
[profile.dev.package.serde_json]
opt-level = 2
# The resident compiles the divination authority guest (a 5 MiB component) in every owner
# process it starts; Cranelift unoptimised makes that tens of seconds in a debug build.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.cranelift-bitset]
opt-level = 2
[profile.dev.package.cranelift-control]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime]
opt-level = 2

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

# Published custody clients share the host door types.
[patch.crates-io.ostiary]
version = "0.0.1"
git = "https://github.com/merely-made/armillary.git"
branch = "main"

