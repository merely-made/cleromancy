[package]
name = "cleromancy-sky"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MPL-2.0"
description = "Embeddable named-zone daily sky timelines and source-qualified receipts"
repository = "https://github.com/merely-made/cleromancy"

[workspace]
resolver = "2"

[dependencies]
turquet = { version = "=0.17.0", path = "../turquet" }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
# Receipt floats must retain their exact bits through JSON decoding, including
# when this library is built without the application's feature unification.
serde_json = { version = "1", features = ["float_roundtrip"] }
blake3 = "1"
