# cargo-deny configuration for cleromancy.
#
#   cargo deny check bans
#
# Two versions of one crate in a build are a defect: move the older version's
# holder forward. Each skip below is a duplicate that cannot be removed from
# here yet: who holds it, and what removes it. Delete an entry when its holder
# moves; `cargo deny check bans` names any that no longer match.

[graph]
all-features = true

[bans]
multiple-versions = "deny"
wildcards = "allow"

