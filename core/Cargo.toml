[package]
rust-version = "1.97.1"
name = "cleromancy-core-acceptance"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "cleromancy"
path = "../src/lib.rs"

[features]
default = ["portable-core"]
portable-core = []
legacy-receipts = []
# These names mirror root-library cfgs but do not widen this acceptance
# package beyond its supported sky-timeline gate.
analytic-ephemeris = []
graphshell-admission = []
personal-sync = []
sky-timeline = ["dep:turquet-timeline"]

[dependencies]
blake3 = "1"
chartulary = { git = "https://www.github.com/merely-made/mere.git", rev = "b590f7d991a14aa0b9b8971c397aedea0dc249f7" }
chirograph = { git = "https://www.github.com/merely-made/mere.git", rev = "b590f7d991a14aa0b9b8971c397aedea0dc249f7" }
graphshell-client = { git = "https://www.github.com/merely-made/mere.git", rev = "b590f7d991a14aa0b9b8971c397aedea0dc249f7" }
mere = { git = "https://www.github.com/merely-made/mere.git", rev = "b590f7d991a14aa0b9b8971c397aedea0dc249f7", default-features = false, features = ["graph"] }
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "b590f7d991a14aa0b9b8971c397aedea0dc249f7", features = ["redb"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "b590f7d991a14aa0b9b8971c397aedea0dc249f7" }
scenotime = { git = "https://www.github.com/merely-made/mere.git", rev = "b590f7d991a14aa0b9b8971c397aedea0dc249f7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servitor = { git = "https://www.github.com/merely-made/mere.git", rev = "b590f7d991a14aa0b9b8971c397aedea0dc249f7" }
thiserror = "2"
turquet-timeline = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "30875f30e83909f3030bc01237a5046e14cde29b", version = "=0.17.0", optional = true }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[lints.rust]
dead_code = "allow"

[[test]]
name = "sky"
path = "../tests/sky.rs"

[[test]]
name = "sky_host"
path = "../tests/sky_host.rs"

[[test]]
name = "sky_timeline"
path = "../tests/sky_timeline.rs"

[[test]]
name = "resident_candidate"
path = "../tests/resident_candidate.rs"

[patch."https://github.com/merely-made/mere.git"]
