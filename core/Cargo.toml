[package]
name = "cleromancy-core-acceptance"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "cleromancy"
path = "../src/lib.rs"

[features]
default = ["portable-core"]
portable-core = []
# These names mirror root-library cfgs but do not widen this acceptance
# package beyond its supported sky-timeline gate.
analytic-ephemeris = []
graphshell-admission = []
personal-sync = []
sky-timeline = ["dep:turquet-timeline"]

[dependencies]
blake3 = "1"
chartulary = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
chirograph = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
graphshell-client = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
mere = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10", default-features = false, features = ["graph"] }
muniment = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10", features = ["redb"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sceno = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
scenotime = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servitor = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
thiserror = "2"
turquet-timeline = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "30875f30e83909f3030bc01237a5046e14cde29b", version = "=0.17.0", optional = true }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[lints.rust]
dead_code = "allow"

[[test]]
name = "sky"
path = "../tests/sky.rs"

[[test]]
name = "sky_host"
path = "../tests/sky_host.rs"

[[test]]
name = "sky_timeline"
path = "../tests/sky_timeline.rs"
