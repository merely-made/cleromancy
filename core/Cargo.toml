[package]
rust-version = "1.97.1"
name = "cleromancy-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "cleromancy"
path = "../src/lib.rs"

[features]
default = ["portable-core"]
portable-core = []
local-inference = []
legacy-receipts = []
# These names mirror root-library cfgs but do not widen this acceptance
# package beyond its supported sky-timeline gate.
analytic-ephemeris = []
graphshell-admission = []
personal-sync = []
sky-timeline = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
personal-facts = { package = "mere-facts", git = "https://github.com/merely-made/mere.git", branch = "main" }
dramatis = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }

blake3 = "1"
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "8626888bf4f6af1147c9691f031c56197afef22b" }
chirograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-client = { git = "https://github.com/merely-made/mere.git", branch = "main" }
mere = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["graph"] }
muniment = { features = ["redb"], git = "https://github.com/merely-made/eidetic.git", rev = "8626888bf4f6af1147c9691f031c56197afef22b" }
rand_core = { version = "0.6", features = ["getrandom"] }
sceno = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
seiche = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["serde"] }
alembic = { package = "mere-alembic", git = "https://github.com/merely-made/mere.git", branch = "main", features = ["recall"] }
scenotime = { git = "https://github.com/merely-made/mere.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servitor = { git = "https://github.com/merely-made/eidetic.git", rev = "8626888bf4f6af1147c9691f031c56197afef22b" }
thiserror = "2"
# One Turquet 0.17 source serves the timeline (30875f30), houses (e2f65c02) and
# cap (8e3755bb) editions; 8e3755bb reproduces the first two bit for bit.
turquet-017 = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "8e3755bbd0d40343eb4750b072801c941ff32802", version = "=0.17.0" }

[dev-dependencies]
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
pollster = "0.4"
tempfile = "3"

[lints.rust]
dead_code = "allow"

[[test]]
name = "sky"
path = "../tests/sky.rs"

[[test]]
name = "sky_host"
path = "../tests/sky_host.rs"

[[test]]
name = "sky_timeline"
path = "../tests/sky_timeline.rs"

[[test]]
name = "resident_candidate"
path = "../tests/resident_candidate.rs"


[patch.crates-io]
# Promoted sources shared with immutable older Mere suppliers.
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "8626888bf4f6af1147c9691f031c56197afef22b" }
servitor = { git = "https://github.com/merely-made/eidetic.git", rev = "8626888bf4f6af1147c9691f031c56197afef22b" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "8626888bf4f6af1147c9691f031c56197afef22b" }

[[test]]
name = "typed_decks"
path = "../tests/typed_decks.rs"

[[test]]
name = "ambient"
path = "../tests/ambient.rs"

[[test]]
name = "shuffled_deck"
path = "../tests/shuffled_deck.rs"

[[test]]
name = "situation"
path = "../tests/situation.rs"

[[test]]
name = "inference"
path = "../tests/inference.rs"

[[test]]
name = "natal"
path = "../tests/natal.rs"

[patch."https://github.com/merely-made/mere.git"]
chartulary = { git = "https://github.com/merely-made/eidetic.git", rev = "8626888bf4f6af1147c9691f031c56197afef22b" }
muniment = { git = "https://github.com/merely-made/eidetic.git", rev = "8626888bf4f6af1147c9691f031c56197afef22b" }
servitor = { git = "https://github.com/merely-made/eidetic.git", rev = "8626888bf4f6af1147c9691f031c56197afef22b" }

