[package]
rust-version = "1.97.1"
name = "cleromancy-core-acceptance"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "cleromancy"
path = "../src/lib.rs"

[features]
default = ["portable-core"]
portable-core = []
local-inference = []
legacy-receipts = []
# These names mirror root-library cfgs but do not widen this acceptance
# package beyond its supported sky-timeline gate.
analytic-ephemeris = []
graphshell-admission = []
personal-sync = []
sky-timeline = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
personal-facts = { package = "mere-personal-facts", git = "https://github.com/merely-made/mere.git", branch = "main" }
dramatis = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }

blake3 = "1"
chartulary = { git = "https://github.com/merely-made/mere.git", branch = "main" }
chirograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
graphshell-client = { git = "https://github.com/merely-made/mere.git", branch = "main" }
mere = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["graph"] }
muniment = { git = "https://github.com/merely-made/mere.git", branch = "main", features = ["redb"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sceno = { git = "https://github.com/merely-made/mere.git", branch = "main" }
scenograph = { git = "https://github.com/merely-made/mere.git", branch = "main" }
seiche = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["serde"] }
alembic = { package = "mere-alembic", git = "https://github.com/merely-made/mere.git", branch = "main", features = ["recall"] }
scenotime = { git = "https://github.com/merely-made/mere.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servitor = { git = "https://github.com/merely-made/mere.git", branch = "main" }
thiserror = "2"
turquet-timeline = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "30875f30e83909f3030bc01237a5046e14cde29b", version = "=0.17.0" }
turquet-houses = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "e2f65c021a6bf744ab5fe77121e0441a46b47306", version = "=0.17.0" }
turquet-cap = { package = "turquet", git = "https://github.com/merely-made/turquet.git", rev = "8e3755bbd0d40343eb4750b072801c941ff32802", version = "=0.17.0" }

[dev-dependencies]
personae = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
pollster = "0.4"
tempfile = "3"

[lints.rust]
dead_code = "allow"

[[test]]
name = "sky"
path = "../tests/sky.rs"

[[test]]
name = "sky_host"
path = "../tests/sky_host.rs"

[[test]]
name = "sky_timeline"
path = "../tests/sky_timeline.rs"

[[test]]
name = "resident_candidate"
path = "../tests/resident_candidate.rs"


[patch.crates-io]
mere-proofs = { git = "https://github.com/merely-made/mere.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/mere.git", branch = "main" }

[[test]]
name = "typed_decks"
path = "../tests/typed_decks.rs"

[[test]]
name = "ambient"
path = "../tests/ambient.rs"

[[test]]
name = "shuffled_deck"
path = "../tests/shuffled_deck.rs"

[[test]]
name = "situation"
path = "../tests/situation.rs"

[[test]]
name = "inference"
path = "../tests/inference.rs"

[[test]]
name = "natal"
path = "../tests/natal.rs"
