[package]
name = "authority-guest"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The portable-core package, whose manifest no longer names muniment's redb.
cleromancy = { package = "cleromancy-core", path = "../../../core" }
mere = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["graph"] }
serde_json = "1"
wit-bindgen = { version = "0.57", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
