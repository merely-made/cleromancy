# The P3 wasm feasibility spike (cycle breaks plan, P3 step 2): Cleromancy's
# divination validator as a wasm component, and a native harness that runs it
# under wasmtime over the corpus of `tests/authority_corpus.rs`. Not part of the
# product, not published; its own lock root, seeded from `core/Cargo.lock` so the
# guest resolves the same Mere, Eidetic and Graphshell revisions core does.
[workspace]
resolver = "2"
members = ["guest", "host"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
